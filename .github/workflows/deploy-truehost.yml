name: Deploy to Truehost production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truehost-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site to Truehost
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP for validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './uploads/*' -print0 | xargs -0 -n1 php -l

      - name: Record deployed revision
        run: printf '{"commit":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment.json

      - name: Deploy to Truehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TRUEHOST_FTP_SERVER }}
          username: ${{ secrets.TRUEHOST_FTP_USERNAME }}
          password: ${{ secrets.TRUEHOST_FTP_PASSWORD }}
          protocol: ${{ secrets.TRUEHOST_FTP_PROTOCOL }}
          port: ${{ secrets.TRUEHOST_FTP_PORT }}
          local-dir: ./
          server-dir: ${{ secrets.TRUEHOST_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config.php
            **/install.php
            **/uploads/**
